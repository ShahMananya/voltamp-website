      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {

      // Cleanup to ensure body stays flush at top 0 and any injected banner iframe remains suppressed
      (function() {
        function removeGoogleBanner() {
          if (document.body && document.body.style.top !== '0px') {
            document.body.style.top = '0px';
          }
          var frames = document.querySelectorAll('iframe.skiptranslate, iframe.goog-te-banner-frame, .VIpgJd-ZVi9od-ORHb-Oxf5Fd');
          frames.forEach(function(frame) {
            frame.style.setProperty('display', 'none', 'important');

            frame.style.setProperty('height', '0px', 'important');
            frame.style.setProperty('width', '0px', 'important');
            frame.style.setProperty('top', '-9999px', 'important');
          });
        }

        if (typeof window !== 'undefined') {
          var observer = new MutationObserver(function() {
            removeGoogleBanner();
          });
          if (document.documentElement) {
            observer.observe(document.documentElement, {
              attributes: true,
              childList: true,
              subtree: true,
              attributeFilter: ['style', 'class']
            });
          }
          window.addEventListener('load', removeGoogleBanner);
          setInterval(removeGoogleBanner, 400);
        }
      })();

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Background Blueprint Paper Grid -->
  <rect width="800" height="800" fill="#081426" />
  <pattern id="gridLug" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162947" stroke-width="0.75" />
    <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#233e68" stroke-width="1.25" opacity="0.4" />
  </pattern>
  <rect width="800" height="800" fill="url(#gridLug)" />

  <!-- Technical Header Box -->
  <rect x="30" y="25" width="740" height="60" rx="8" fill="#0c203b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
  <text x="50" y="52" font-family="monospace" font-size="16" font-weight="bold" fill="#38bdf8" letter-spacing="1.5">VOLAMP ELEKTRIKALS · CABLE LUG CAD SPECIFICATION BLUEPRINT</text>
  <text x="50" y="72" font-family="monospace" font-size="11" fill="#94a3b8">STANDARD: DIN 46235 / IS 8309 · MATERIAL: ELECTRO-TINNED ETP COPPER · HEAVY DUTY</text>

  <!-- Lug CAD Drawing in Center -->
  <g transform="translate(180, 220)">
    <!-- Top View of Tubular Lug -->
    <text x="-120" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">[ PLAN VIEW ]</text>
    
    <!-- Barrel Outline -->
    <path d="M 0 0 L 180 0 C 200 0 210 -20 230 -25 L 350 -25 C 380 -25 400 -5 400 35 C 400 75 380 95 350 95 L 230 95 C 210 90 200 70 180 70 L 0 70 Z" 
          fill="#1e3a5f" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Chamfer / Bell Mouth Entry (Left) -->
    <path d="M -15 -8 L 0 0 L 0 70 L -15 78 Z" fill="#0f2744" stroke="#38bdf8" stroke-width="1.8" />
    
    <!-- Inspection Window in Barrel -->
    <ellipse cx="130" cy="35" rx="14" ry="10" fill="#081426" stroke="#38bdf8" stroke-width="2" />
    <text x="130" y="38" font-family="monospace" font-size="8" fill="#38bdf8" text-anchor="middle">INSPECT</text>
    
    <!-- Palm Mounting Hole -->
    <circle cx="320" cy="35" r="28" fill="#081426" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 320 -5 L 320 75 M 280 35 L 360 35" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3" />
    
    <!-- Centerline Axis -->
    <path d="M -35 35 L 420 35" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="8 4 2 4" />

    <!-- Dimension Callouts -->
    <!-- Dimension: Total Length (L) -->
    <path d="M -15 130 L 400 130" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M -15 85 L -15 140 M 400 95 L 400 140" stroke="#f59e0b" stroke-width="1" />
    <path d="M -15 130 L -5 127 M -15 130 L -5 133 M 400 130 L 390 127 M 400 130 L 390 133" stroke="#f59e0b" stroke-width="1.5" />
    <text x="190" y="125" font-family="monospace" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">OVERALL LENGTH (L)</text>

    <!-- Dimension: Palm Width (B) -->
    <path d="M 435 -25 L 435 95" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M 380 -25 L 445 -25 M 380 95 L 445 95" stroke="#f59e0b" stroke-width="1" />
    <text x="450" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b">PALM (B)</text>

    <!-- Dimension: Stud Hole (E / d2) -->
    <path d="M 320 35 L 365 -45 L 420 -45" fill="none" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="320" cy="35" r="3" fill="#22c55e" />
    <text x="430" y="-42" font-family="monospace" font-size="11" font-weight="bold" fill="#22c55e">STUD HOLE DIA (d2): M8 / M10 / M12</text>

    <!-- Dimension: Barrel Internal Diameter (d1) -->
    <path d="M 60 70 L 60 -45 L -20 -45" fill="none" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="60" cy="70" r="3" fill="#22c55e" />
    <text x="-25" y="-42" font-family="monospace" font-size="11" font-weight="bold" fill="#22c55e" text-anchor="end">BARREL ID (d1) PRECISION BORE</text>
  </g>

  <!-- Technical Spec Matrix Table at Bottom -->
  <g transform="translate(40, 480)">
    <rect width="720" height="210" rx="6" fill="#0d1f36" stroke="#334155" stroke-width="1" />
    <rect width="720" height="34" rx="6" fill="#1e3a5f" />
    <text x="20" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">TECHNICAL CHARACTERISTICS & MANUFACTURING STANDARDS</text>

    <text x="20" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Raw Material Purity:</text>
    <text x="240" y="65" font-family="monospace" font-size="11" fill="#cbd5e1">99.97% Pure Electrolytic High-Conductivity Copper (ETP Grade)</text>

    <text x="20" y="95" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Surface Electroplating:</text>
    <text x="240" y="95" font-family="monospace" font-size="11" fill="#cbd5e1">Pure Matte Tin Plated (minimum 5 - 10 Microns thickness to prevent oxidation)</text>

    <text x="20" y="125" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Chamfer & Entry Design:</text>
    <text x="240" y="125" font-family="monospace" font-size="11" fill="#cbd5e1">Internal Bell-Mouth Entry for easy insertion of flexible stranded Class 5 cables</text>

    <text x="20" y="155" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Visual Crimp Assurance:</text>
    <text x="240" y="155" font-family="monospace" font-size="11" fill="#cbd5e1">Punched Inspection Hole guarantees full conductor penetration prior to crimping</text>

    <text x="20" y="185" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Quality & Testing Standard:</text>
    <text x="240" y="185" font-family="monospace" font-size="11" fill="#22c55e">IS 8309 / DIN 46235 / IEC 61238-1 (Short-Circuit & Pull-out Tensile Tested)</text>
  </g>

  <!-- Footer Certification Bar -->
  <rect x="30" y="725" width="740" height="45" rx="6" fill="#0c1626" stroke="#334155" stroke-width="1" />
  <text x="50" y="752" font-family="monospace" font-size="10.5" fill="#64748b">VOLAMP ELEKTRIKALS PVT LTD · AHMEDABAD · ISO 9001:2015 CERTIFIED FACILITY · CPRI TYPE TESTED</text>
</svg>
